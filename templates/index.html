<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Income Predictor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --glass: rgba(255,255,255,0.08);
      --glow1: #00ffe0;
      --glow2: #6aa0ff;
      --bp: #ff6b6b;
      --fg: #eaf6ff;
      --bg1: #0f2027; --bg2:#203a43; --bg3:#2c5364;
    }
    * { box-sizing: border-box; margin:0; padding:0; }
    html, body { height:100%; overflow:hidden; }
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--fg);
      background: radial-gradient(1200px 800px at 20% 10%, #0b1a20 0%, transparent 60%),
                  linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    }

    /* Canvas background */
    #nn-canvas {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display:block;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
    }

    /* Overlay UI */
    .overlay {
      position: fixed; inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none; /* let mouse pass through except buttons */
    }
    .card {
      pointer-events: auto;
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      padding: clamp(1.5rem, 2vw + 1rem, 3rem);
      width: min(92vw, 720px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 0 60px rgba(255,255,255,0.04);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .card::before{
      content:"";
      position:absolute; inset:-1px;
      background:
        radial-gradient(800px 200px at 0% 0%, rgba(106,160,255,0.15), transparent 60%),
        radial-gradient(500px 300px at 100% 100%, rgba(0,255,224,0.12), transparent 60%);
      z-index:-1;
      pointer-events:none;
    }
    h1 {
      font-size: clamp(1.9rem, 1.2rem + 2vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: .5rem;
      background: linear-gradient(90deg, #eaf6ff, #b7d7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.sub {
      color: #cfe7ff;
      opacity:.9;
      margin-bottom: 1.25rem;
    }

    .cta-row{
      display:flex; gap: .75rem; flex-wrap:wrap; align-items:center;
      margin-top: .75rem;
    }
    .btn {
      appearance: none; border: 0; cursor: pointer;
      border-radius: 999px;
      padding: .9rem 1.35rem;
      font-weight: 700;
      letter-spacing: .2px;
      background: linear-gradient(135deg, var(--glow1), var(--glow2));
      color: #06121a;
      box-shadow:
          0 14px 30px rgba(0,255,224,0.20),
          0 4px 10px rgba(106,160,255,0.25),
          inset 0 0 0 1px rgba(255,255,255,0.15);
      transform: translateZ(0);
      transition: transform .15s ease, filter .2s ease, box-shadow .2s ease;
      text-decoration: none;
      pointer-events:auto;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn:active { transform: translateY(0); }

    .pill {
      display:inline-flex; align-items:center; gap:.5rem;
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.12);
      color: #e9f5ff;
      padding: .55rem .9rem;
      border-radius: 999px;
      font-weight: 600;
      pointer-events: none;
    }

    /* Tiny legend */
    .legend {
      display:flex; gap:.75rem; flex-wrap:wrap; margin-top: .75rem;
      font-size: .85rem; color:#dbeeff;
      opacity:.9;
    }
    .dot { width:.75rem; height:.75rem; border-radius:50%; display:inline-block; vertical-align:middle; margin-right:.35rem; }
    .dot-fwd { background: var(--glow1); box-shadow: 0 0 12px var(--glow1); }
    .dot-bwd { background: var(--bp); box-shadow: 0 0 12px var(--bp); }
    .dot-w   { background: var(--glow2); box-shadow: 0 0 12px var(--glow2); }
  </style>
</head>
<body>
  <canvas id="nn-canvas"></canvas>

  <div class="overlay">
    <section class="card">
      <span class="pill">Real-time Neural Net Simulation</span>
      <h1>Income Predictor</h1>
      <p class="sub">A living, breathing network animates behind this glass — forward activations, backprop pulses, and weight updates in motion.</p>

      <div class="legend">
        <span><span class="dot dot-fwd"></span>Forward activation</span>
        <span><span class="dot dot-bwd"></span>Backprop signal</span>
        <span><span class="dot dot-w"></span>Weight update</span>
      </div>

      <div class="cta-row">
        <a class="btn" href="{{ url_for('predict_datapoints') }}">🚀 Start Prediction</a>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('nn-canvas');
      const ctx = canvas.getContext('2d');
      let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
      function resize() {
        W = canvas.clientWidth = window.innerWidth;
        H = canvas.clientHeight = window.innerHeight;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      window.addEventListener('resize', resize, { passive: true });
      resize();

      // ------- Neural layout (perspective layers) -------
      const layers = [10, 18, 12, 8]; // nodes per layer (tweakable)
      const depth = layers.length;
      const marginX = 160;
      const marginY = 80;

      function lerp(a,b,t){return a + (b-a)*t;}
      function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
      function rand(a,b){return a + Math.random()*(b-a);}

      // Perspective params
      const cam = { z: 900, fov: 700, wobble: 0 };
      const grid = {
        left: marginX, right: () => W - marginX,
        top:  marginY, bottom: () => H - marginY
      };

      const nodes = []; // {x,y,z, a, noise, vx, vy}
      const edges = []; // {i,j, w, pulse, dir}
      const layerIndex = []; // boundary index per layer

      // Build nodes with gentle noise
      let idx = 0, xStep = (grid.right() - grid.left) / (layers.length - 1);
      for (let L = 0; L < layers.length; L++){
        const count = layers[L];
        const x = grid.left + L * xStep;
        const lyTop = grid.top;
        const lyBottom = grid.bottom();
        for (let n = 0; n < count; n++){
          const y = lerp(lyTop, lyBottom, (n + 1) / (count + 1));
          nodes.push({
            x, y, z: L * 200, a: 0,
            noise: rand(0, 1), vx: 0, vy: 0
          });
          idx++;
        }
        layerIndex.push(idx);
      }

      // Build edges between adjacent layers
      function idxOf(L, n){ return (L === 0 ? 0 : layerIndex[L-1]) + n; }
      for (let L = 0; L < layers.length - 1; L++){
        for (let i = 0; i < layers[L]; i++){
          for (let j = 0; j < layers[L+1]; j++){
            const a = idxOf(L, i), b = idxOf(L+1, j);
            edges.push({
              i: a, j: b,
              w: rand(0.3, 1.2), // weight magnitude
              pulse: 0,          // 0..1 pulse along edge
              dir: 1             // +1 forward, -1 backward
            });
          }
        }
      }

      // Sim phases: forward -> settle -> backprop -> settle
      const phases = [
        { name: 'forward', dur: 2.2, color: '#00ffe0' },
        { name: 'settle',  dur: 0.6, color: '#74c0fc' },
        { name: 'backprop',dur: 2.0, color: '#ff6b6b' },
        { name: 'settle',  dur: 0.6, color: '#74c0fc' }
      ];
      let phaseIdx = 0, phaseT = 0;

      // Cursor light parallax
      const cursor = {x: W*0.5, y:H*0.5};
      window.addEventListener('pointermove', e => {
        cursor.x = e.clientX; cursor.y = e.clientY;
      }, { passive:true });

      // Project 3D-ish to 2D (z by layer)
      function project(p){
        const z = cam.z - p.z - cam.wobble;
        const scale = cam.fov / z;
        return { x: (p.x - W/2)*scale + W/2, y: (p.y - H/2)*scale + H/2, s: scale };
      }

      // Activate a layer’s nodes
      function activateLayer(L, amt){
        const start = (L === 0 ? 0 : layerIndex[L-1]);
        const end = layerIndex[L];
        for (let i = start; i < end; i++){
          const n = nodes[i];
          n.a = Math.max(n.a, amt);
        }
      }

      // Advance pulses along edges
      function pulseEdges(dir, dt){
        for (const e of edges){
          e.dir = dir;
          e.pulse += dt / rand(0.8,1.3); // add variety
          if (e.pulse > 1) e.pulse = 0;
        }
      }

      // Weight adaptation wiggle
      function adaptWeights(dt){
        for (const e of edges){
          const delta = (Math.random() - 0.5) * 0.02 * dt * 60;
          e.w = clamp(e.w + delta, 0.25, 1.5);
        }
      }

      // Gentle node breathing + parallax to cursor
      function moveNodes(t){
        const cx = cursor.x, cy = cursor.y;
        for (const n of nodes){
          const pr = project(n); // for parallax
          const dx = (cx - pr.x) * 0.0008;
          const dy = (cy - pr.y) * 0.0008;
          n.vx += dx; n.vy += dy;
          n.vx *= 0.94; n.vy *= 0.94;
          n.x += n.vx;  n.y += n.vy;

          // breathing noise
          n.y += Math.sin(t*0.8 + n.noise*6.28) * 0.05;
          n.x += Math.cos(t*0.6 + n.noise*4.12) * 0.05;
        }
      }

      // Render
      function draw(t, dt){
        // vignette background pass
        ctx.clearRect(0,0,W,H);
        const g = ctx.createLinearGradient(0,0, W,H);
        g.addColorStop(0, 'rgba(255,255,255,0.04)');
        g.addColorStop(1, 'rgba(255,255,255,0.00)');
        ctx.fillStyle = g;
        ctx.fillRect(0,0,W,H);

        // connections (draw back to front for depth)
        ctx.lineCap = 'round';
        for (const e of edges){
          const a = nodes[e.i], b = nodes[e.j];
          const ap = project(a), bp = project(b);
          const w = e.w * 1.2 * (ap.s + bp.s);

          // base wire
          ctx.globalAlpha = 0.18;
          ctx.strokeStyle = '#bfe5ff';
          ctx.lineWidth = w;
          ctx.beginPath();
          ctx.moveTo(ap.x, ap.y);
          ctx.lineTo(bp.x, bp.y);
          ctx.stroke();

          // glow wire
          ctx.globalAlpha = 0.10;
          ctx.lineWidth = w * 2.4;
          ctx.stroke();

          // animated pulse
          const p = e.pulse;
          const px = ap.x + (bp.x - ap.x) * p;
          const py = ap.y + (bp.y - ap.y) * p;
          const grad = ctx.createRadialGradient(px, py, 0, px, py, 60);
          const color = (phases[phaseIdx].name === 'backprop') ? getCSS('--bp') : getCSS('--glow1');
          grad.addColorStop(0, hexToRgba(color, 0.9));
          grad.addColorStop(1, hexToRgba(color, 0.0));
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(px, py, 60, 0, Math.PI*2);
          ctx.fill();
        }

        // nodes
        for (const n of nodes){
          const p = project(n);
          const r = 5 + 8 * p.s;
          const aura = r * 4;
          const aGlow = n.a * 0.9;

          // outer aura
          const rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, aura);
          rg.addColorStop(0, hexToRgba('#bfe5ff', 0.16 + aGlow*0.3));
          rg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.globalAlpha = 1;
          ctx.fillStyle = rg;
          ctx.beginPath(); ctx.arc(p.x, p.y, aura, 0, Math.PI*2); ctx.fill();

          // core
          ctx.fillStyle = '#eaf6ff';
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();

          // slight highlight
          ctx.globalAlpha = 0.5 + 0.5 * n.a;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(p.x - r*0.3, p.y - r*0.3, r*0.35, 0, Math.PI*2); ctx.fill();

          // decay activation
          n.a *= 0.90;
        }
      }

      function getCSS(varName){
        return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
      }
      function hexToRgba(hex, a){
        let h = hex.replace('#','');
        if (h.length === 3) h = h.split('').map(c => c+c).join('');
        const n = parseInt(h,16);
        const r = (n>>16)&255, g=(n>>8)&255, b=n&255;
        return `rgba(${r},${g},${b},${a})`;
      }

      // Animation loop
      let last = performance.now();
      function loop(now){
        const dt = Math.min(0.05, (now - last)/1000); last = now;
        const t = now/1000;

        // phase timing
        phaseT += dt;
        const ph = phases[phaseIdx];
        if (phaseT >= ph.dur){
          phaseT = 0; phaseIdx = (phaseIdx + 1) % phases.length;
        }

        // network dynamics
        if (ph.name === 'forward'){
          // sweep activations left->right
          const total = layers.length;
          const prog = phaseT / ph.dur;
          const activeLayer = Math.floor(prog * total);
          activateLayer(activeLayer, 1.0);
          pulseEdges(+1, dt);
          adaptWeights(dt * 0.5);
        } else if (ph.name === 'backprop'){
          // sweep right->left
          const total = layers.length;
          const prog = phaseT / ph.dur;
          const activeLayer = total - 1 - Math.floor(prog * total);
          activateLayer(activeLayer, 0.9);
          pulseEdges(-1, dt);
          adaptWeights(dt * 0.7);
        } else {
          // settle
          pulseEdges(+1, dt * 0.5);
          adaptWeights(dt * 0.2);
        }

        // subtle camera wobble
        cam.wobble = Math.sin(t*0.8) * 40 + Math.cos(t*0.6) * 25;

        moveNodes(t);
        draw(t, dt);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
