<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Income Predictor - Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
        }

        .form-container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            color: white;
        }

        h2 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 30px;
        }

        label {
            font-weight: 500;
            margin-bottom: 5px;
        }

        input, select {
            background: rgba(255, 255, 255, 0.15) !important;
            border: none !important;
            color: white !important;
        }

        input:focus, select:focus {
            outline: none !important;
            box-shadow: 0 0 5px #00f7ff;
        }

        select option {
            color: black;
        }

        .btn-custom {
            background: #00f7ff;
            color: #000;
            font-weight: bold;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background: #00d4e6;
            transform: translateY(-2px);
        }

        .alert {
            background: rgba(0, 255, 200, 0.2);
            border: 1px solid #00f7ff;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Enter Your Details</h2>
        <form action="{{ url_for('predict_datapoints') }}" method="POST">

            <!-- Numerical Fields -->
            <div class="row g-3">
                <div class="col-md-4">
                    <label>Age</label>
                    <input type="number" name="age" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Final Weight (fnlwgt)</label>
                    <input type="number" name="fnlwgt" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Educational Number</label>
                    <input type="number" name="educational_num" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Capital Gain</label>
                    <input type="number" name="capital_gain" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Capital Loss</label>
                    <input type="number" name="capital_loss" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Hours Per Week</label>
                    <input type="number" name="hours_per_week" class="form-control" required>
                </div>
            </div>

            <!-- Categorical Fields -->
            <div class="row g-3 mt-3">
                <div class="col-md-4">
                    <label>Workclass</label>
                    <select name="workclass" class="form-select" required>
                        <option value="Private">Private</option>
                        <option value="Self-emp-not-inc">Self-emp-not-inc</option>
                        <option value="Self-emp-inc">Self-emp-inc</option>
                        <option value="Federal-gov">Federal-gov</option>
                        <option value="Local-gov">Local-gov</option>
                        <option value="State-gov">State-gov</option>
                        <option value="Without-pay">Without-pay</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label>Education</label>
                    <select name="education" class="form-select" required>
                        <option value="Bachelors">Bachelors</option>
                        <option value="Some-college">Some-college</option>
                        <option value="11th">11th</option>
                        <option value="HS-grad">HS-grad</option>
                        <option value="Masters">Masters</option>
                        <option value="9th">9th</option>
                        <option value="Assoc-acdm">Assoc-acdm</option>
                        <option value="Assoc-voc">Assoc-voc</option>
                        <option value="7th-8th">7th-8th</option>
                        <option value="Doctorate">Doctorate</option>
                        <option value="Prof-school">Prof-school</option>
                        <option value="5th-6th">5th-6th</option>
                        <option value="10th">10th</option>
                        <option value="1st-4th">1st-4th</option>
                        <option value="Preschool">Preschool</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label>Marital Status</label>
                    <select name="marital_status" class="form-select" required>
                        <option value="Married-civ-spouse">Married-civ-spouse</option>
                        <option value="Divorced">Divorced</option>
                        <option value="Never-married">Never-married</option>
                        <option value="Separated">Separated</option>
                        <option value="Widowed">Widowed</option>
                        <option value="Married-spouse-absent">Married-spouse-absent</option>
                        <option value="Married-AF-spouse">Married-AF-spouse</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label>Occupation</label>
                    <select name="occupation" class="form-select" required>
                        <option value="Tech-support">Tech-support</option>
                        <option value="Craft-repair">Craft-repair</option>
                        <option value="Other-service">Other-service</option>
                        <option value="Sales">Sales</option>
                        <option value="Exec-managerial">Exec-managerial</option>
                        <option value="Prof-specialty">Prof-specialty</option>
                        <option value="Handlers-cleaners">Handlers-cleaners</option>
                        <option value="Machine-op-inspct">Machine-op-inspct</option>
                        <option value="Adm-clerical">Adm-clerical</option>
                        <option value="Farming-fishing">Farming-fishing</option>
                        <option value="Transport-moving">Transport-moving</option>
                        <option value="Priv-house-serv">Priv-house-serv</option>
                        <option value="Protective-serv">Protective-serv</option>
                        <option value="Armed-Forces">Armed-Forces</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label>Relationship</label>
                    <select name="relationship" class="form-select" required>
                        <option value="Wife">Wife</option>
                        <option value="Own-child">Own-child</option>
                        <option value="Husband">Husband</option>
                        <option value="Not-in-family">Not-in-family</option>
                        <option value="Other-relative">Other-relative</option>
                        <option value="Unmarried">Unmarried</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label>Race</label>
                    <select name="race" class="form-select" required>
                        <option value="White">White</option>
                        <option value="Asian-Pac-Islander">Asian-Pac-Islander</option>
                        <option value="Amer-Indian-Eskimo">Amer-Indian-Eskimo</option>
                        <option value="Other">Other</option>
                        <option value="Black">Black</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label>Gender</label>
                    <select name="gender" class="form-select" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label>Native Country</label>
                    <select name="native_country" class="form-select" required>
                        <option value="United-States">United-States</option>
                        <option value="Mexico">Mexico</option>
                        <option value="Philippines">Philippines</option>
                        <option value="Germany">Germany</option>
                        <option value="Canada">Canada</option>
                        <option value="Puerto-Rico">Puerto-Rico</option>
                        <option value="El-Salvador">El-Salvador</option>
                        <option value="India">India</option>
                        <option value="Cuba">Cuba</option>
                        <option value="England">England</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="mt-4">
                <button type="submit" class="btn btn-custom w-100">Predict</button>
            </div>

            {% if results %}
                <div class="alert mt-4">
                    <strong>Prediction:</strong> {{ results }}
                </div>
            {% endif %}
        </form>
    </div>
</body>
</html>
